# Website + PostgreSQL on one server (VPS). Usage:
#   1. create a `.env` file next to this one with ADMIN_PASSWORD, POSTGRES_PASSWORD and SITE_URL
#   2. docker compose up -d --build
#   3. put a reverse proxy with HTTPS in front (Caddy/Nginx) — see DEPLOY.md
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      DATABASE_URL: postgres://ember:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ember
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ember
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
